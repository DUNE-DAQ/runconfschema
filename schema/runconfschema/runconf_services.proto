// Protobuf controls for options menu
syntax = "proto3";

package dunedaq.runconfschema;

import "google/protobuf/any.proto";

import "runconfschema/bootstrap.proto";
import "runconfschema/common.proto";
import "runconfschema/configuration_access.proto";
import "runconfschema/main_controls.proto";
import "runconfschema/state.proto";

service RunconfService {
    // Called once, by whoever starts the server, with the context every frontend shares.
    // Fails with ALREADY_EXISTS if the server has already been booted.
    rpc boot (BootRequest) returns (Initialisation) {}
    // Called by each frontend on connect: the current state of a booted server.
    rpc initialise(RequestInitialisation) returns (Initialisation) {}
    // Dropdowns and config opening
    rpc select_dropdown(DropDownSelection) returns (DropDownUpdate) {}
    rpc open_configuration(Open) returns (ConfigurationOutcome) {}
    // State handling
    rpc get_node_state(RequestNodeStatus) returns (ResponseNodeStatus) {}
    rpc set_node_state(RequestSetNodeValue) returns (ResponseNodeStatus) {}
    rpc reset_node_state(RequestReset) returns (ResponseNodeStatus) {}
    rpc get_node_groups(RequestNodeGroups) returns (ResponseNodeGroups) {}
    rpc get_configuration_info(RequestConfigurationInfo) returns (ConfigurationInfo) {}
    // General Operations
    rpc runconf_command(RunconfCommandRequest) returns (RunconfCommandResponse) {}
}