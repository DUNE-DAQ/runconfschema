syntax = "proto3";

package dunedaq.runconfschema;

import "runconfschema/common.proto";

// Messages from the runconf-ui backend

/// Node status enum
enum NodeStatus {
  INCLUDED = 0;
  EXCLUDED = 1;
  PARENT_EXCLUDED = 2;
}

enum NodeGroup {
  TOGGLES = 0;
  ADJUSTABLE = 1;
}


// // Info about the node
message NodeStatusInfo {
  NodeStatus node_state = 1;  // Is the node enabled/disabled/has its parent disabled?
  repeated string node_path = 2; // Path to the node in the tree
  optional double node_value = 3; // Value of the node (directly asks the node so will not be a NodeStatus)
  optional string tooltip = 4; // Additional information to display if a GUI representing the node is hovered over
  optional NodeGroup node_group = 5; // Group of the node (toggles or adjustable)
  repeated NodeStatusInfo children = 6; // Children of the node (note: This does not need to be sent unless we're building a tree, but it is included here for completeness)
}

message RequestSetNodeValue {
  NodeGroup node_group = 1;
  repeated string path = 2; // Path to the node in the tree
  oneof node_value { // The value to set the node to
    double double_value = 3;
    bool bool_value = 4;
    NodeStatus node_status_value = 5;
  }
}

message RequestNodeStatus {
  NodeGroup node_group = 1;
  repeated string path = 2; // Path to the node in the tree
}

message ResponseNodeStatus {
  // Sends changed nodes
  Response response = 1; // Response message indicating success/failure of the request
  repeated NodeStatusInfo nodes = 2; // List of nodes that have changed (or the requested node if only one was requested)
}

message RequestReset {}