syntax = "proto3";

package dunedaq.runconfschema;

import "runconfschema/common.proto";

// Messages from the runconf-ui backend

/// Node status enum
enum NodeStatus {
  INCLUDED = 0;
  EXCLUDED = 1;
  PARENT_EXCLUDED = 2;
}

enum NodeGroup {
  TOGGLES = 0;
  ADJUSTABLE = 1;
}


// // Info about the node
message NodeStatusInfo {
  reserved 3; // was: optional double node_value (replaced by the typed oneof below)
  NodeStatus node_state = 1;  // Is the node enabled/disabled/has its parent disabled?
  // Path used to address the node: [group_id, (parent,) label]. Empty for nodes that
  // only appear in a hierarchy (see GroupNodes.systems) and cannot be addressed.
  repeated string node_path = 2;
  optional string tooltip = 4; // Additional information to display if a GUI representing the node is hovered over
  optional NodeGroup node_group = 5; // Group of the node (toggles or adjustable)
  repeated NodeStatusInfo children = 6; // Child nodes, in display order. Only filled in hierarchies (GroupNodes.systems).
  oneof value { // Current value of the node, in its native type. Unset if the node has no value.
    double double_value = 7;
    int64 int_value = 8;
    bool bool_value = 9;  // for toggles: true == included
    string string_value = 10;
  }
  string label = 11; // Display label of the node
}

// Everything the frontend needs about one group of nodes (a tab in the UI)
message GroupNodes {
  string group_id = 1;
  NodeGroup node_group = 2;
  // Flat list of the group's addressable nodes, in display order. Used for the
  // toggle buttons / value inputs. States account for every ancestor.
  repeated NodeStatusInfo nodes = 3;
  // The group's hierarchy: one root per system, with nested children. Nodes that
  // can be addressed carry a node_path. States are relative to the direct parent.
  repeated NodeStatusInfo systems = 4;
  // Title of the group's tree-view panel. Unset if the group has no tree view.
  optional string view_panel = 5;
}

message RequestSetNodeValue {
  NodeGroup node_group = 1;
  repeated string path = 2; // Path to the node in the tree
  oneof node_value { // The value to set the node to
    double double_value = 3;
    bool bool_value = 4;
    NodeStatus node_status_value = 5;
    int64 int_value = 6;
    string string_value = 7; // passed to the backend as-is (e.g. raw text from an input box)
  }
}

message RequestNodeStatus {
  NodeGroup node_group = 1;
  repeated string path = 2; // Path to the node in the tree
}

message ResponseNodeStatus {
  // Sends changed nodes
  Response response = 1; // Response message indicating success/failure of the request
  repeated NodeStatusInfo nodes = 2; // List of nodes that have changed (or the requested node if only one was requested)
}

message RequestReset {}

message RequestNodeGroups {}

message ResponseNodeGroups {
  Response response = 1;
  repeated GroupNodes groups = 2; // toggle groups first, then adjustable groups
}