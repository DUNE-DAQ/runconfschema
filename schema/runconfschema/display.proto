syntax = "proto3";

package dunedaq.runconfschema;

import "runconfschema/common.proto";

// Read-only for TUI, pre-rendered views of the backend state for display in a frontend.

// A tree of display labels. Labels use Rich console markup, e.g. "[bold green]crp4[/]".
message DisplayTree {
  string label = 1;
  repeated DisplayTree children = 2;
}

// A tree view belonging to one node group
message GroupTree {
  string group_id = 1;
  DisplayTree tree = 2;
}

message RequestViews {}

message DisplayViews {
  Response response = 1;
  bool config_open = 2;                // whether a configuration is currently loaded
  repeated GroupTree group_trees = 3;  // one per group with a view panel, in display order
  optional DisplayTree config_tree = 4; // the full configuration tree (unset if nothing is open)
  string info_text = 5;                // summary of the loaded configuration (Rich markup)
  optional string session_name = 6;    // id of the Session object in the loaded configuration
}
